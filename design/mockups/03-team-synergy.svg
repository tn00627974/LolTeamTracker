    <text x="684" y="588" font-size="11" fill="#5B5A56">5 勝 6 敗</text>
    <rect x="790" y="579" width="440" height="8" rx="4" fill="#1E3A5F"/>
    <rect x="790" y="579" width="200" height="8" rx="4" fill="#E8636F"/>
    <text x="1336" y="588" font-size="14" font-weight="600" fill="#E8636F" text-anchor="end">45.5%</text>
  </g>

  <line x1="548" y1="616" x2="1336" y2="616" stroke="#16304A"/>

