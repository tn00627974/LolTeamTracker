  <text x="548" y="434" font-size="12" fill="#8A8578">42 場 · 26 勝 16 敗 · 彈性積分</text>
  <text x="1336" y="424" font-size="30" font-weight="700" fill="#0AC8B9" text-anchor="end">61.9%</text>
