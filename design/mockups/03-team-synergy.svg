<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0E6D2"/>
      <stop offset="0.55" stop-color="#C8AA6E"/>
      <stop offset="1" stop-color="#7A5C28"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1626"/>
      <stop offset="1" stop-color="#010A13"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- ===== Navbar ===== -->
  <rect x="0" y="0" width="1440" height="64" fill="#0A1526"/>
  <rect x="0" y="63" width="1440" height="1" fill="#785A28"/>
  <rect x="40" y="20" width="24" height="24" rx="6" fill="url(#gold)"/>
  <text x="52" y="37" font-size="13" font-weight="700" fill="#010A13" text-anchor="middle">LT</text>
  <text x="76" y="40" font-size="19" font-weight="700" fill="#C8AA6E">LolTeamTracker</text>
  <text x="920" y="39" font-size="15" fill="#A09B8C">玩家查詢</text>
  <text x="1040" y="39" font-size="15" fill="#A09B8C">團隊分析</text>
  <text x="1160" y="39" font-size="15" font-weight="600" fill="#C8AA6E">配對分析</text>
  <rect x="1160" y="48" width="64" height="3" rx="1.5" fill="#C8AA6E"/>
  <text x="1280" y="39" font-size="15" fill="#A09B8C">資料管理</text>

  <!-- ===== 標題 + 同步 ===== -->
  <text x="80" y="128" font-size="30" font-weight="700" fill="#F0E6D2">隊友配對分析</text>
  <text x="80" y="156" font-size="14" fill="#8A8578">以某位成員為視角，看與其他成員同隊時的勝率，以及哪種分路搭配最強</text>
  <rect x="1180" y="106" width="180" height="46" rx="8" fill="none" stroke="#785A28"/>
  <path d="M 1212 122 a 9 9 0 1 0 4 -6" fill="none" stroke="#C8AA6E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1212 114 l 0 8 l 8 0" fill="none" stroke="#C8AA6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1290" y="135" font-size="14" fill="#C8AA6E" text-anchor="middle">同步比賽資料</text>

  <!-- ===== 控制列 ===== -->
  <rect x="80" y="188" width="1280" height="56" rx="10" fill="#0F2137" stroke="#1E3A5F"/>

  <!-- 視角選擇：這是「A 的角度」的入口 -->
  <text x="104" y="222" font-size="13" fill="#8A8578">視角</text>
  <rect x="142" y="202" width="190" height="36" rx="8" fill="#16304A" stroke="#1E3A5F"/>
  <rect x="152" y="210" width="20" height="20" rx="4" fill="#1E3A5F"/>
  <text x="162" y="225" font-size="11" fill="#8FB4D6" text-anchor="middle">子</text>
  <text x="180" y="225" font-size="14" fill="#F0E6D2">子文 # TW1</text>
  <path d="M 306 218 l 6 6 l 6 -6" fill="none" stroke="#A09B8C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="356" y1="200" x2="356" y2="232" stroke="#1E3A5F"/>

  <!-- 模式篩選 -->
  <text x="380" y="222" font-size="13" fill="#8A8578">模式</text>
  <rect x="418" y="204" width="60" height="32" rx="16" fill="none" stroke="#1E3A5F"/>
  <text x="448" y="224" font-size="13" fill="#A09B8C" text-anchor="middle">全部</text>
  <rect x="488" y="204" width="76" height="32" rx="16" fill="none" stroke="#1E3A5F"/>
  <text x="526" y="224" font-size="13" fill="#A09B8C" text-anchor="middle">單雙排</text>
  <rect x="574" y="204" width="88" height="32" rx="16" fill="#2A2418" stroke="#C8AA6E"/>
  <text x="618" y="224" font-size="13" font-weight="600" fill="#C8AA6E" text-anchor="middle">彈性積分</text>

  <!-- 最低場次門檻：3 場 100% 沒有意義，門檻是產品決策 -->
  <text x="1230" y="222" font-size="13" fill="#8A8578" text-anchor="end">最低同隊場次</text>
  <rect x="1246" y="202" width="90" height="36" rx="8" fill="#16304A" stroke="#1E3A5F"/>
  <text x="1284" y="225" font-size="13" fill="#F0E6D2" text-anchor="middle">10 場</text>
  <path d="M 1310 218 l 6 6 l 6 -6" fill="none" stroke="#A09B8C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 統計磚 ===== -->
  <rect x="80" y="264" width="410" height="90" rx="10" fill="#0F2137" stroke="#1E3A5F"/>
  <text x="104" y="302" font-size="13" fill="#8A8578">已分析場次</text>
  <text x="104" y="338" font-size="32" font-weight="700" fill="#F0E6D2">128</text>
  <text x="176" y="338" font-size="12" fill="#5B5A56">彈性積分 · 去重後</text>

  <rect x="514" y="264" width="411" height="90" rx="10" fill="#0F2137" stroke="#1E3A5F"/>
  <text x="538" y="302" font-size="13" fill="#8A8578">最佳搭檔（達門檻者）</text>
  <text x="538" y="338" font-size="21" font-weight="700" fill="#F0E6D2">Mia # TW2</text>
  <text x="901" y="338" font-size="28" font-weight="700" fill="#0AC8B9" text-anchor="end">68.4%</text>

  <rect x="949" y="264" width="411" height="90" rx="10" fill="#0F2137" stroke="#1E3A5F"/>
  <text x="973" y="302" font-size="13" fill="#8A8578">我的整體勝率</text>
