    <rect x="830" y="681" width="400" height="8" rx="4" fill="#1E3A5F"/>
    <rect x="830" y="681" width="338" height="8" rx="4" fill="#0AC8B9"/>
    <text x="1336" y="690" font-size="14" font-weight="600" fill="#0AC8B9" text-anchor="end">84.6%</text>
