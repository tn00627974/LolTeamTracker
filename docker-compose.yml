  #      context 太窄會找不到檔案，太寬會讓 build 很慢）
  #   2. depends_on 要不要加 condition: service_healthy？不加會怎樣？
  #   3. 連線字串裡的 Server 要填什麼？
  #      —— 提示：API 在容器內時，localhost 指的是「API 容器自己」，
  #         不是你的 Windows，也不是 mssql 容器。想想 compose 幫你做了什麼。
  #   4. API Key 這種機密怎麼傳進容器？（不要寫在這個檔案裡）
