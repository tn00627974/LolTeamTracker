    <text x="156" y="556" font-size="15" font-weight="600" fill="#F0E6D2">Alan</text>
    <text x="156" y="574" font-size="11" fill="#6E6B5E"># TW2</text>
    <text x="476" y="556" font-size="12" fill="#A09B8C" text-anchor="end">28 場</text>
    <rect x="104" y="586" width="300" height="8" rx="4" fill="#1E3A5F"/>
