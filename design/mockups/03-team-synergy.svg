  <text x="104" y="414" font-size="15" font-weight="700" fill="#F0E6D2">隊友</text>
  <text x="476" y="414" font-size="12" fill="#6E6B5E" text-anchor="end">4 位 · 依同隊場次排序</text>
  <line x1="80" y1="436" x2="500" y2="436" stroke="#16304A"/>

