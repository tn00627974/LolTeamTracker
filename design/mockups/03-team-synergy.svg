    <text x="156" y="470" font-size="15" font-weight="600" fill="#F0E6D2">阿華</text>
    <text x="156" y="488" font-size="11" fill="#6E6B5E"># TW2</text>
    <text x="476" y="470" font-size="12" fill="#A09B8C" text-anchor="end">42 場</text>
    <rect x="104" y="500" width="300" height="8" rx="4" fill="#1E3A5F"/>
    <rect x="104" y="500" width="186" height="8" rx="4" fill="#0AC8B9"/>
    <text x="420" y="508" font-size="13" fill="#0AC8B9">61.9%</text>
