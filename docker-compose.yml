# LolTeamTracker 本機開發環境
#
# 使用方式：
#   1. 複製 .env.example 成 .env，填入資料庫密碼 與 Riot API Key
#   2. docker compose up -d
#   3. docker compose ps        # 看服務狀態，mssql 要是 healthy
#   4. docker compose down      # 停止（資料保留在 volume）
#      docker compose down -v   # 停止並刪除資料（連 volume 一起砍）

# 容器名稱，沒設定則是是資料夾名稱當作容器名。
name: lolteamtracker

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lolteamtracker-mssql
    # Docker 預設只等 10 秒就送 SIGKILL(容易發生Seed 跳號的問題)
    # 被強制砍掉的結果就是重啟後 identity 跳號（實測跳到 1007、2007）。
    stop_grace_period: 120s  # 給 SQL Server 足夠時間關閉避免跳號。
    environment:
      ACCEPT_EULA: "Y"
      # 密碼從 .env 讀取，不寫死在這個檔案裡——這個檔案要進版控
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Developer 版：功能等同 Enterprise，但僅限開發測試用途，免費
      MSSQL_PID: Developer
    ports:
      # 格式是 host:container
      #   左邊 = 你 Windows 上的 port，可以改（例如本機已裝 SQL Server 佔用 1433 時）
      #   右邊 = 容器內 SQL Server 監聽的 port，固定 1433，改了就連不上
      # 這裡用 1434 對外，所以連線字串要寫 Server=localhost,1434
      - "1434:1433"
    volumes:
      # 具名 volume：容器刪掉重建，資料還在。
      # 沒有這行的話，docker compose down 之後你的資料表就消失了。
      - mssql-data:/var/opt/mssql
    healthcheck:
      # 讓 compose 知道「容器啟動」不等於「資料庫可以連線」。
      # SQL Server 冷啟動要十幾秒，這期間 port 已經開了但還不能接受查詢。
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: LolTeamTracker.Api/Dockerfile
    container_name: lolteamtracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=LolTeamTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RiotApi__ApiKey: ${RIOT_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

    
volumes:
  mssql-data:
  # ---------------------------------------------------------------
