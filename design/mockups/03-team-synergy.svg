    <text x="548" y="766" font-size="11" fill="#6E6B5E">我</text>
    <rect x="568" y="747" width="58" height="26" rx="6" fill="#16304A" stroke="#1E3A5F"/>
    <text x="597" y="765" font-size="13" fill="#F0E6D2" text-anchor="middle">打野</text>
    <text x="638" y="766" font-size="13" fill="#5B5A56">+</text>
    <text x="656" y="766" font-size="11" fill="#6E6B5E">他</text>
    <rect x="676" y="747" width="58" height="26" rx="6" fill="#16304A" stroke="#1E3A5F"/>
    <text x="705" y="765" font-size="13" fill="#F0E6D2" text-anchor="middle">中路</text>
    <text x="752" y="766" font-size="12" fill="#8A8578">8 場</text>
    <rect x="830" y="757" width="400" height="8" rx="4" fill="#1E3A5F"/>
    <rect x="830" y="757" width="150" height="8" rx="4" fill="#E8636F"/>
    <text x="1336" y="766" font-size="14" font-weight="600" fill="#E8636F" text-anchor="end">37.5%</text>
