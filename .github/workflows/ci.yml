name: CI

# 什麼時候跑：
#   push 到 main —— 確保主線永遠是可建置、測試通過的狀態
#   pull_request —— 在合併「之前」就知道會不會壞，而不是合併之後才發現
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # 整合測試 SQL Server。runner 是一台乾淨的 ubuntu，
    # 所以在這裡起一個 service container——生命週期跟這個 job 綁在一起，job 結束就銷毀。
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          # 跟本機 compose 用同一組對應。引號不能省：
          # YAML 會把沒引號的 1434:1433 解析成六十進位數字，不是字串。
          - "1434:1433"
        # 注意 $MSSQL_SA_PASSWORD 不是 GitHub Actions 表達式，是「容器內 shell 的變數」。
        # options 欄位不允許 ${{ secrets.* }}（GitHub 限制，怕 secret 出現在 docker 指令列），
        # 但 healthcheck 本來就在容器裡執行，直接讀上面 env 設進去的那個變數即可。
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          # 指定 8.0.x 而不是讓 runner 用預設版本。
          # 本機 SDK 是 10.x，若 CI 用了不同版本，「本機過但 CI 掛」會很難查。
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        # --no-restore：上一步已經還原過了。若這裡又還原一次，
        # 代表上一步的產物沒被沿用——用旗標讓「步驟被跳過」直接變成錯誤。
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # --no-build：測的必須是上一步「剛建好的那份」，不是重新編一次的另一份。
        #
        # 單元測試 用 Moq 隔離外部依賴，不需要任何環境；
        # 整合測試 要碰真的 SQL Server，連線字串由下面的 env 提供。
        env:
          # 只把「密碼」放 secret，連線字串在這裡組。
          # 若整串連線字串都當 secret，密碼會同時存在 secret 和 service container 兩處，
          # 改密碼必然漏掉一邊——跟本機只留一份 .env 是同一個道理。
          #
          # 本機走 .env（TestWebApplicationFactory 自己讀），CI 上沒有 .env，
          # 所以走環境變數這條路——這就是那個 fallback 存在的理由。
          LOLTEAMTRACKER_TEST_DB: "Server=localhost,1434;Database=LolTeamTracker_Test;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True"
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        # 驗證 Dockerfile 本身建得起來。
        # context 是方案根目錄（.），與本機一致——這是 build context 的常見踩雷點。
        run: docker build -f LolTeamTracker.Api/Dockerfile -t lol-team-tracker-api:ci .
