  <text x="578" y="655" font-size="15" font-weight="600" fill="#F0E6D2">分路組合</text>
  <text x="656" y="655" font-size="12" fill="#6E6B5E">我 + 他的搭配（顯示前 3 組，共 9 組）</text>

  <g>
    <text x="548" y="690" font-size="11" fill="#6E6B5E">我</text>
    <rect x="568" y="671" width="58" height="26" rx="6" fill="#16304A" stroke="#1E3A5F"/>
    <text x="597" y="689" font-size="13" fill="#F0E6D2" text-anchor="middle">下路</text>
    <text x="638" y="690" font-size="13" fill="#5B5A56">+</text>
